name: Atualizar dashes

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar Meta e montar o site
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_TOKEN_PEUGEOT: ${{ secrets.META_TOKEN_PEUGEOT }}
          META_TOKEN_LEAPMOTOR: ${{ secrets.META_TOKEN_LEAPMOTOR }}
          META_TOKEN_CITROEN: ${{ secrets.META_TOKEN_CITROEN }}
          META_TOKEN_VOLVO: ${{ secrets.META_TOKEN_VOLVO }}
        run: python scripts/montar.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
